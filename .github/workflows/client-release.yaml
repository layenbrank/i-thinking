name: Client Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0); required when not running on a tag push
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SIDECAR_EXE: apps/client/src-tauri/binaries/corex-serve-x86_64-pc-windows-msvc.exe
  SIDECAR_PDFIUM: apps/client/src-tauri/binaries/pdfium.dll
  BUNDLE_DIR: apps/client/src-tauri/target/release/bundle

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/client/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Tauri target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sidecar binaries
        shell: pwsh
        run: |
          if (-not (Test-Path $env:SIDECAR_EXE)) {
            Write-Error "Missing sidecar: $env:SIDECAR_EXE"
            exit 1
          }
          if (-not (Test-Path $env:SIDECAR_PDFIUM)) {
            Write-Error "Missing pdfium: $env:SIDECAR_PDFIUM"
            exit 1
          }
          Write-Host "Sidecar OK: $env:SIDECAR_EXE"
          Write-Host "Pdfium OK: $env:SIDECAR_PDFIUM"

      - name: Build Tauri client
        env:
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:client

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $bundleDir = $env:BUNDLE_DIR
          if (-not (Test-Path $bundleDir)) {
            Write-Error "Bundle directory not found: $bundleDir"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $patterns = @(
            "$bundleDir\nsis\*.exe",
            "$bundleDir\msi\*.msi",
            "$bundleDir\nsis\*.sig",
            "$bundleDir\msi\*.sig",
            "$bundleDir\**\*.nsis.zip",
            "$bundleDir\**\*.nsis.zip.sig",
            "$bundleDir\**\latest.json"
          )

          $copied = @()
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination release-artifacts -Force
              $copied += $_.Name
              Write-Host "Copied: $($_.FullName)"
            }
          }

          # Fallback: any installer under bundle
          if ($copied.Count -eq 0) {
            Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi,*.sig,latest.json |
              Where-Object { -not $_.PSIsContainer } |
              ForEach-Object {
                Copy-Item $_.FullName -Destination release-artifacts -Force
                $copied += $_.Name
                Write-Host "Copied (fallback): $($_.FullName)"
              }
          }

          if ($copied.Count -eq 0) {
            Write-Error "No release artifacts found under $bundleDir"
            Get-ChildItem -Path $bundleDir -Recurse | Select-Object FullName
            exit 1
          }

          Get-ChildItem release-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Encoding ascii -Append "release-artifacts/SHA256SUMS.txt"
            Write-Host "SHA256 $($_.Name): $hash"
          }

          Write-Host "Release artifacts:"
          Get-ChildItem release-artifacts -File | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Get build info
        id: build_info
        shell: pwsh
        run: |
          $commit_hash = git rev-parse HEAD
          $commit_short = git rev-parse --short HEAD
          $commit_message = git log -1 --pretty=format:"%s"
          $commit_author = git log -1 --pretty=format:"%an"
          $commit_date = git log -1 --pretty=format:"%ci"
          $rust_version = rustc --version
          $cargo_version = cargo --version
          $node_version = node --version

          echo "hash=$commit_hash" >> $env:GITHUB_OUTPUT
          echo "short=$commit_short" >> $env:GITHUB_OUTPUT
          echo "message=$commit_message" >> $env:GITHUB_OUTPUT
          echo "author=$commit_author" >> $env:GITHUB_OUTPUT
          echo "date=$commit_date" >> $env:GITHUB_OUTPUT
          echo "rust_version=$rust_version" >> $env:GITHUB_OUTPUT
          echo "cargo_version=$cargo_version" >> $env:GITHUB_OUTPUT
          echo "node_version=$node_version" >> $env:GITHUB_OUTPUT

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ inputs.tag }}" -ne "") {
            echo "name=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "No tag: push a v* tag, or pass workflow_dispatch input tag"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          files: release-artifacts/*
          name: Client ${{ steps.release_tag.outputs.name }}
          body: |
            ## Client ${{ steps.release_tag.outputs.name }}

            ### Release Information
            - **Tag**: ${{ steps.release_tag.outputs.name }}
            - **Commit**: `${{ steps.build_info.outputs.short }}`
            - **Author**: ${{ steps.build_info.outputs.author }}
            - **Date**: ${{ steps.build_info.outputs.date }}

            ### Commit Message
            ```
            ${{ steps.build_info.outputs.message }}
            ```

            ### Build Information
            - **Platform**: Windows x64 (x86_64-pc-windows-msvc)
            - **Node**: ${{ steps.build_info.outputs.node_version }}
            - **Rust**: ${{ steps.build_info.outputs.rust_version }}
            - **Cargo**: ${{ steps.build_info.outputs.cargo_version }}
            - `pnpm build:client` (turbo ^build + Tauri 2)

            ### Updater
            - Endpoint: `https://github.com/${{ github.repository }}/releases/latest/download/latest.json`
            - Installers and `.sig` / `latest.json` are attached when signing secrets are configured.

            ### Full Changelog
            **Full Commit**: [`${{ steps.build_info.outputs.short }}`](https://github.com/${{ github.repository }}/commit/${{ steps.build_info.outputs.hash }})
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.name, 'alpha') || contains(steps.release_tag.outputs.name, 'beta') || contains(steps.release_tag.outputs.name, 'rc') }}
          generate_release_notes: true
