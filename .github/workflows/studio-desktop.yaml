name: Studio Desktop

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - 'apps/studio/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/studio-desktop.yaml'

concurrency:
  group: studio-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: sidecar (${{ matrix.platform_key }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap sidecars (corex release + pandoc)
        run: pnpm command sidecar bootstrap studio

      - name: Pack staging archive
        shell: bash
        run: |
          KEY="${{ matrix.platform_key }}"
          SHA="$(git rev-parse --short=12 HEAD)"
          STAGING="apps/studio/sidecar/staging/${KEY}"
          OUT="studio-sidecar-${SHA}-${KEY}.tar.gz"
          tar -czf "${OUT}" -C "${STAGING}" .
          if command -v sha256sum >/dev/null; then
            sha256sum "${OUT}" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}" > "${OUT}.sha256"
          fi

      - name: Upload sidecar artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sidecar-${{ matrix.platform_key }}
          retention-days: 30
          path: |
            studio-sidecar-*.tar.gz
            studio-sidecar-*.sha256

  make:
    name: make (${{ matrix.os }})
    needs: sidecar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @i-thinking/studio exec prisma generate

      - name: Rebuild natives
        run: pnpm --filter @i-thinking/studio rebuild

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: sidecar-${{ matrix.platform_key }}
          path: .sidecar-ci

      - name: Restore staging
        shell: bash
        run: |
          KEY="${{ matrix.platform_key }}"
          DEST="apps/studio/sidecar/staging/${KEY}"
          mkdir -p "${DEST}"
          ARCHIVE="$(ls .sidecar-ci/studio-sidecar-*-${KEY}.tar.gz | head -n1)"
          tar -xzf "${ARCHIVE}" -C "${DEST}"
          pnpm command sidecar verify studio

      - name: Make installers
        env:
          NODE_ENV: production
        run: pnpm --filter @i-thinking/studio make

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-${{ matrix.os }}
          retention-days: 14
          path: |
            out/studio/**
          if-no-files-found: warn
