openapi: 3.1.0

info:
  title: core ↔ ai-worker 内部契约
  version: 0.1.0-draft
  x-contract-owner: core
  x-status: draft
  description: |
    `core` 调用 `ai-worker`（Python 计算车间）的内部契约，**唯一契约源**。

    谁在被约束：`core` 侧只有 `src/clients/ai_worker.rs` 允许出站调这些路径；写在这个文件
    之外的 `/internal/**` 路径一律由 `bun run arch`（R11）拦住，不允许手写路由游离在契约外。
    `ai-worker` 侧（P6）按本文件实现，先用 `spec/internal.yaml` 定形，Python 侧照它写路由。

    三条约定：

    1. **方向单向**：只有 core 调 ai-worker。ai-worker 是叶子：不调别的东西、不直连业务表、
       不持长期云凭据、不接触对象存储布局（它拿不到对象存储键，也没有能直接读对象的凭据）。
       **例外只有四条（P6a / P6b / P9a 起）**：ai-worker 需要**资产正文**时，回打 core 的
       `POST /api/v1/service/token`（用 `X-Internal-Token` 换 `scope=asset-read` 的短期令牌）
       再带 `X-Service-Token` 调 `GET /api/v1/service/assets/{assetID}/content` 取字节；
       需要**嵌入算力**时，同样先换 `scope=embeddings` 的令牌，再调
       `POST /api/v1/service/embeddings` 转发嵌入；需要**对话算力**（服务端 agent 的单步推理）
       时，先换 `scope=chat` 的令牌，再调 `POST /api/v1/service/chat/completions`。
       这四条是 core 的公开 OpenAPI
       （`spec/openapi.json`）的一部分，**不**列在本文件的 `paths` 里——本文件只描述
       core → ai-worker 的方向。除这四条外，ai-worker 不得对 core 发起任何其他请求：
       令牌自带受众与作用域（租户 + 模型 / 租户 + 单个资产），拿到手就换不了别的用途。
    2. **响应不用公开信封**：内部调用用 HTTP 状态码 + 裸 JSON（公开契约的 `code/message/data`
       信封只服务前端）。错误体统一为 `{"error":{"code","message"}}`。
    3. **写操作必须带幂等键**：`Idempotency-Key` 由 core 用「编排实例 id + 步骤」派生，同一
       键重复投递必须收敛为同一个结果（core 侧活动是「至少执行一次」，重试是常态）。同一个
       键带着**不同载荷**到达时返回 409，不允许悄悄按新载荷执行。

    重试语义：core 把 429 / 5xx / 超时视为可重试（活动级重试，退避由可靠执行运行时负责）；
    4xx（除 429）视为不可重试，直接把实例判失败。所以 ai-worker 只有「确定没做成」才能回 4xx。

    字段命名：JSON 一律 camelCase，标识后缀固定 `ID`（`assetID` / `tenantID`）。
    所有非健康检查端点都必须带 `traceparent`（W3C），跨语言排障只能靠它。
  contact:
    name: i-thinking core
    url: https://github.com/i-thinking
license:
  name: UNLICENSED

servers:
  - url: http://127.0.0.1:8081
    description: 本地开发（docker-compose 的 ai-worker）
  - url: http://ai-worker:8081
    description: 容器内网络（docker-compose 服务名）

tags:
  - name: health
    description: 健康与能力自述
  - name: rag
    description: RAG 索引（分块 → 嵌入 → 落索引）
  - name: agent
    description: 服务端智能体（单步推理 + 只读工具）

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      tags: [health]
      summary: 健康与能力自述
      description: |
        给 core 的 readiness 检查用（P7）：进程活着不够，还要能自报依赖与能力。
        本端点不需要令牌，也不做任何 IO 以外的副作用。
      responses:
        '200':
          description: 进程可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 进程活着但依赖不可用（core 的 readiness 应当转失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /internal/v1/assets/{assetID}/chunks:
    post:
      operationId: internalChunkAsset
      tags: [rag]
      summary: 抽取文本并分块（core 侧长任务的第一步）
      description: |
        ai-worker 自己把资产正文取来：先回打 core 换一枚 `scope=asset-read` 的服务身份令牌，
        再带 `X-Service-Token` 调 core 的 `GET /api/v1/service/assets/{assetID}/content`
        （令牌作用域锁死租户与这一个资产，路径参数只是比对，不符即 403）。取出正文后抽取
        纯文本、切成块，并**自己持有块数据**（chunk 表属于 ai-worker）。它只把「切了多少块、
        块集 id」回给 core —— 文本不进编排历史，否则历史会被正文撑爆，重放成本也会失控。

        同一个 `Idempotency-Key` 重复调用必须返回同一份 `chunkSetID`，且不重复切分/写入。
        对象存储布局只存在于 core 内：请求体里没有对象键，ai-worker 也不持长期的云凭据。
      parameters:
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkRequest'
      responses:
        '200':
          description: 分块完成（或幂等命中，返回首次结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /internal/v1/assets/{assetID}/embeddings:
    post:
      operationId: internalEmbedChunkRange
      tags: [rag]
      summary: 为一组块算嵌入（可分批、可重试）
      description: |
        只处理块集的 `[from, to)` 区间：core 把长任务切成小步，每步一个活动，崩了只重跑
        没做完的那几步。`model` 由 core 决定（core 的 gateway 是唯一出网点与唯一计量点），
        ai-worker 只按给定模型算，不许自己换模型或静默降级。
      parameters:
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: 该区间的嵌入已算好（或幂等命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /internal/v1/assets/{assetID}/index:
    put:
      operationId: internalUpsertAssetIndex
      tags: [rag]
      summary: 把块集与向量落进检索索引（长任务最后一步）
      description: |
        索引（含向量）属于 ai-worker，可重建。core 只提供块集 id 与统计值，不搬运向量。
        重复提交同一个 `chunkSetID` 必须收敛：索引条数不叠加、旧版本被替换而不是并存。
      parameters:
        - $ref: '#/components/parameters/AssetID'
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
      responses:
        '200':
          description: 索引已落库（或幂等命中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /internal/v1/agents/steps:
    post:
      operationId: internalAgentStep
      tags: [agent]
      summary: 服务端智能体的**一步**（一次推理 + 至多一轮只读工具）
      description: |
        多轮循环的宿主是 core 的可靠执行（一个步骤一个活动），这里只做**无状态的一步**：
        拿到「目标 + 到上一步为止的历史」，调一次对话模型，若模型要求调工具就把工具跑掉，
        把结果原样交回 core。**循环、状态、历史都在 core**——所以本端点没有对话会话概念，
        同一步骤重投必须收敛为同一个结果（幂等键 = `<实例 id>:<步骤>`）。

        模型自己不出网：这里用 `scope=chat` 的服务身份令牌回打 core 的
        `POST /api/v1/service/chat/completions`（core 是唯一出网点与唯一计量点），
        检索时用 `scope=embeddings` 的令牌调 core 的 `POST /api/v1/service/embeddings`。
        本进程里没有 API Key，也没有厂商 base_url 配置，换不了别的用途。

        **工具只能读**（`knowledge_search` 检索本租户已索引的块、`asset_read` 读单个资产
        正文）：写操作、发消息、改状态一律不进本阶段。没有任意 HTTP 取数工具（SSRF）。
        `allowedTools` 是 core 给的**白名单**，不在名单里的工具名模型给了也不执行，
        记为一条失败的工具结果喂回模型（让它自己改口），而不是把整个步骤判失败。

        失败面的分界是「重试有没有意义」：

        * **工具失败是正常流程**：参数 JSON 不合法、未知工具名、资产不存在、正文抽不出文本
          ——都回一条 `ok=false` 的 `AgentToolResult`，让模型自己纠错，整个步骤仍然是 200；
        * **只有暂时性故障才回 429 / 503**（core 限流、模型或向量库不可用），交给 core 的活动级
          重试；4xx 不可重试（参数不合法、白名单词汇不认识等）。

        能力自述：`agent.step` 是本端点；`rag.search` 是本步内部用的检索面
        （向量相似度走 ai-worker 自己的 pgvector），它**不单独开端点**，只作为工具被本步骤调用。
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStepRequest'
      responses:
        '200':
          description: 这一步完成了（含「模型要求了一次失败的工具调用」这种正常结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  parameters:
    AssetID:
      name: assetID
      in: path
      required: true
      description: core 的资产 id（uuid）。
      schema:
        type: string
        format: uuid
    InternalToken:
      name: X-Internal-Token
      in: header
      required: true
      description: 内部共享令牌（`ai_worker.token`）。公网不可达，但不做 IP 白名单依赖。
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        core 用「编排实例 id + 步骤」派生：`<实例 id>:<步骤>`，例如
        `rag-index-<assetID>:embed:0-16`。同键重复投递 → 返回首次结果；同键不同载荷 → 409。
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Traceparent:
      name: traceparent
      in: header
      required: true
      description: W3C Trace Context。core 的活动必须透传当前链路的 traceparent。
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'

  responses:
    BadRequest:
      description: 请求体不合法（core 侧当不可重试失败处理）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 令牌缺失或无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: 同一个幂等键带着不同载荷到达（不按新载荷执行）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 限流，可重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: 依赖（模型、向量库、对象存储）暂不可用，可重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 稳定的机器可读代码，例如 `invalid_request` / `idempotency_conflict`。
            message:
              type: string

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: ai-worker 版本号（排障用，非契约版本）。
        capabilities:
          type: array
          items:
            type: string
          description: |
            自述能力清单（不只是端点，也含只被编排内部调用的能力）：
            `["rag.chunk", "rag.embed", "rag.index", "agent.step", "rag.search"]`。

    ChunkRequest:
      type: object
      required: [schemaVersion, tenantID, mime]
      properties:
        schemaVersion:
          type: integer
          const: 1
        tenantID:
          type: string
          description: 租户 id；ai-worker 只用于分区与日志，不参与授权判定。
        mime:
          type: string
          description: 资产类型（core 的 `asset.mime`）；内容端点响应的 `content-type` 与之同一来源。
        name:
          type: string
          description: 原始文件名，用于抽取器选择策略（可为空）。
        chunkSize:
          type: integer
          minimum: 1
          description: 目标块大小（字符数）。缺省由 ai-worker 自己定。
        chunkOverlap:
          type: integer
          minimum: 0
          description: 相邻块重叠字符数。缺省由 ai-worker 自己定。

    ChunkResponse:
      type: object
      required: [chunkSetID, chunkCount]
      properties:
        chunkSetID:
          type: string
          description: 块集 id（ai-worker 生成）；后续嵌入与落索引都用它，不再传文本。
        chunkCount:
          type: integer
          minimum: 0
        textSha:
          type: string
          description: 抽取后纯文本的 sha256（十六进制），用于幂等核对与审计。

    EmbedRequest:
      type: object
      required: [schemaVersion, tenantID, chunkSetID, model, from, to]
      properties:
        schemaVersion:
          type: integer
          const: 1
        tenantID:
          type: string
        chunkSetID:
          type: string
        model:
          type: string
          description: 由 core 指定（core 的 gateway 是唯一出网点与计量点）。
        from:
          type: integer
          minimum: 0
          description: 起始块下标（含）。
        to:
          type: integer
          minimum: 0
          description: 结束块下标（不含）；`to > from`。

    EmbedResponse:
      type: object
      required: [from, to, embedded, dimensions]
      properties:
        from:
          type: integer
        to:
          type: integer
        embedded:
          type: integer
          description: 本次实际写入的向量数（幂等命中时为 0）。
        dimensions:
          type: integer

    IndexRequest:
      type: object
      required: [schemaVersion, tenantID, chunkSetID, chunkCount, model, dimensions]
      properties:
        schemaVersion:
          type: integer
          const: 1
        tenantID:
          type: string
        chunkSetID:
          type: string
        chunkCount:
          type: integer
          minimum: 0
        model:
          type: string
        dimensions:
          type: integer

    IndexResponse:
      type: object
      required: [indexed, collection]
      properties:
        indexed:
          type: integer
          description: 索引里的块数（幂等命中时返回首次结果，不叠加）。
        collection:
          type: string
          description: 索引集合名（排障与审计用）。

    AgentStepRequest:
      type: object
      required: [schemaVersion, tenantID, objective, model, embedModel]
      properties:
        schemaVersion:
          type: integer
          const: 1
        tenantID:
          type: string
          description: 租户 id；本步的全部检索与读资产都只在这个租户范围内进行。
        objective:
          type: string
          description: 任务的原始目标（自然语言）。只有第一步（`history` 为空）用它起头。
        model:
          type: string
          description: 对话模型，由 core 指定（core 的 gateway 是唯一出网点与计量点）。
        embedModel:
          type: string
          description: |
            检索用的嵌入模型。必须与 `rag.index` 落库时用的 `model` 一致——
            向量空间不同算不出可比的相似度，所以这是 core 的责任，不是这里猜的。
        history:
          type: array
          description: |-
            到上一步为止的对话历史；缺失或空数组表示这是第一步。
            **不要放 `role=system` 的消息**：系统提示词由 ai-worker 每步自己前置，
            core 塞一条进来会变成重复/冲突指令，服务端会直接判 400。
          items:
            $ref: '#/components/schemas/AgentMessage'
        allowedTools:
          type: array
          description: |
            本步允许调用的**只读**工具名白名单（词汇：`knowledge_search` / `asset_read`）。
            空数组 = 不给工具，只要一条结论。
          items:
            type: string
        remainingSteps:
          type: integer
          minimum: 0
          description: |
            预算：还剩几步（含本步）。小于等于 1 时本步不再提供工具——
            模型必须给出结论，否则 core 就会在下一次调用上撞到硬止损。

    AgentStepResponse:
      type: object
      required: [schemaVersion, finished, message, toolResults, usage]
      properties:
        schemaVersion:
          type: integer
          const: 1
        finished:
          type: boolean
          description: |
            当且仅当 `message.toolCalls` 为空时为 true —— 模型没有再要工具，core 据此收尾。
            本阶段没有别的收尾途径（没有「结束」工具，也没有人在环审批）。
        message:
          $ref: '#/components/schemas/AgentMessage'
        toolResults:
          type: array
          description: 本步每次工具调用的结果，与 `message.toolCalls` 一一对应（同序）。
          items:
            $ref: '#/components/schemas/AgentToolResult'
        usage:
          $ref: '#/components/schemas/AgentUsage'

    AgentMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          description: 文本内容；要求了工具的 assistant 消息可以没有文本。
        toolCalls:
          type: array
          description: 只有 `role=assistant` 会有；模型要求调用的工具（可能为空数组）。
          items:
            $ref: '#/components/schemas/AgentToolCall'
        toolCallID:
          type: string
          description: 只有 `role=tool` 会有；指回它所回应的那次调用。

    AgentToolCall:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: 模型给的调用 id（回灌结果时按它对齐）。
        name:
          type: string
          description: 工具名（`knowledge_search` / `asset_read`）。
        arguments:
          type: string
          description: |
            参数对象 **JSON 字符串**（`"{\"query\":\"…\"}"`）：这就是 OpenAI 工具调用的线格式，
            所以 core 不需要在中间反序列化再序列化一遍，历史可以整条原样回灌。
            解析失败不算服务故障——见 `AgentToolResult.ok`。
        toolCallType:
          type: string
          description: 上游字段 `type`（固定 `function`），照抄不改写。

    AgentToolResult:
      type: object
      required: [toolCallID, name, ok, content]
      properties:
        toolCallID:
          type: string
          description: 对应 `AgentToolCall.id`。
        name:
          type: string
        ok:
          type: boolean
          description: 工具是否真的执行成功。false 也是**正常结果**（模型会读到 `content` 里的原因）。
        content:
          type: string
          description: |
            交给模型读的结果文本（失败时是失败原因）。已按服务端配置截断（超长结果只留头部
            与说明），否则一次工具调用就能把上下文撑爆。
        error:
          type: string
          description: 失败时的稳定机器码（只进 core 的日志与审计，不喂模型）；成功时为空。

    AgentUsage:
      type: object
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
          description: 上游没给用量时三个值都是 0（不编造）。
