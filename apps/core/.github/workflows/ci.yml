name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # 覆盖本地 .cargo/config.toml 里面向 Windows / sccache 的设置，保证 Linux runner 可编
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
  RUSTC_WRAPPER: ""

jobs:
  test-and-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Neutralize local cargo wrappers for CI
        run: |
          # 仓库 .cargo/config.toml 默认指向 Windows + sccache，不适合 GitHub Linux runner
          printf '%s\n' '[build]' 'target-dir = "target"' > .cargo/config.toml

      - name: Install script dependencies
        run: bun install --frozen-lockfile

      - name: Architecture hygiene
        run: bun run arch
      - name: Run unit tests
        run: cargo test --lib -p service

      - name: Run OpenAPI consistency tests
        run: cargo test --test oas_consistency

      - name: Export OpenAPI spec
        run: cargo run --bin docs

      - name: Verify openapi.json is up to date
        run: git diff --exit-code spec/openapi.json

      - name: Build with openapi feature
        run: cargo build --features openapi --bin service

  aliyun-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/aliyun-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sidecars/aliyun-gateway/go.sum

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./command/server
