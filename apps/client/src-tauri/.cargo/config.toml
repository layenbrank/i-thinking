[build]
target-dir    = "target" # 构建输出目录
# rustc-wrapper = "sccache"       # 已注释：可替换为 sccache 实际路径；启用后可显著加速增量编译，但需本地安装与配置
incremental   = true

# -------------------------- Windows 平台配置 --------------------------
[target.x86_64-pc-windows-msvc]
# 使用MSVC链接器（需安装Visual Studio构建工具）
linker = "link.exe"
rustflags = [
  "-C",
  "target-cpu=native", # 开发机本地指令集优化（提升增量编译体验）
#  "-C",
#  "link-arg=/STACK:67108864", # 提升默认线程栈（64MB），避免 Tauri 上下文生成时栈溢出
  "-C",
  "opt-level=3",        # 已注释：发布级优化；会显著增加编译与链接时间，降低开发热更新速度
  "-C",
  "codegen-units=16",   # 已注释：代码生成单元设置；在 debug 中放到 rustflags 容易造成编译波动，建议放在 profile.dev 中统一控制
#  "-C",
#  "target-feature=+crt-static", # 已注释：静态链接 MSVC 运行时；会增加链接时间与体积，开发期不必要
#  # "-C",
#  # "link-arg=/SUBSYSTEM:CONSOLE", # 已注释：显示控制台窗口；仅影响子系统，不影响编译速度
#  # "-C",
#  # "link-arg=/SUBSYSTEM:WINDOWS", # 已注释：隐藏控制台窗口；仅影响子系统，不影响编译速度
#  "-C",
#  "link-arg=/OPT:REF",  # 已注释：链接时去除未引用代码；可减小体积但会增加链接耗时
]

# -------------------------- Linux 平台配置 --------------------------
[target.x86_64-unknown-linux-gnu]
# 使用lld链接器加速链接过程（需提前安装lld）
linker = "lld"
# 编译优化：最高级别优化+静态链接+二进制瘦身
rustflags = [
  "-C",
  "target-cpu=native",          # 开发机本地指令集优化
  "-C",
  "link-arg=-fuse-ld=lld",
#  "-C",
#  "target-feature=+crt-static", # 已注释：静态链接 C 运行时；增加链接耗时与体积
#  "-C",
#  "opt-level=3",                # 已注释：发布级优化；显著增加编译时间
#  "-C",
#  "link-arg=-s",                # 已注释：移除符号表；开发期调试不友好
#  "-C",
#  "strip=debuginfo",            # 已注释：剥离调试信息；影响调试体验
]

[target.aarch64-unknown-linux-gnu]
# ARM64 Linux交叉编译配置（需安装aarch64-linux-gnu-gcc工具链）
linker = "aarch64-linux-gnu-gcc" # 交叉编译器
rustflags = [
  "-C",
  "target-cpu=native",
#  "-C",
#  "opt-level=3",                # 已注释：发布级优化；显著增加编译时间
#  "-C",
#  "target-feature=+crt-static", # 已注释：静态链接 C 运行时；增加链接耗时与体积
]

# -------------------------- macOS 平台配置 --------------------------
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = [
  "-C",
  "target-cpu=native",
  "-C",
  "link-arg=-mmacosx-version-min=10.15", # 最低支持macOS 10.15
#  "-C",
#  "opt-level=3",                          # 已注释：发布级优化；会明显增加编译/链接耗时
#  "-C",
#  "link-arg=-dead_strip",                # 已注释：移除未使用代码；会增加链接时间
]

[target.aarch64-apple-darwin]
# M系列芯片macOS配置
linker = "clang"
rustflags = [
  "-C",
  "target-cpu=apple-m1", # 针对M1/M2芯片优化
#  "-C",
#  "opt-level=3",         # 已注释：发布级优化；会明显增加编译/链接耗时
]

