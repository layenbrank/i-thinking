[workspace]
members = [".", "crates/database", "crates/core", "crates/command"]
resolver = "2"

[workspace.dependencies]
sea-orm = { version = "1.1.19", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }
sea-query = "1.0.0"
sea-orm-migration = "1.1.19"
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
tauri = { version = "2.11.2", features = [
  "protocol-asset",
  "macos-private-api",
  "devtools",
  "tray-icon",
  "image-png",
] }
thinking-database = { path = "crates/database" }
thinking-core = { path = "crates/core" }
thinking-command = { path = "crates/command" }

[package]
name = "i-thinking"
version = "1.2.1"
description = "i thinking is a privacy-first extension that enhances your browsing experience with intelligent features while prioritizing your data security."
authors = ["layen"]
edition = "2024"

[[bin]]
name = "i-thinking"
path = "src/main.rs"

[lib]
name = "thinking"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
# 开发环境：关闭增量编译（有时增量编译反而会导致 target 膨胀和链接变慢）
# 降低 debug 信息级别，极大减少 target 体积和链接时间
debug = 0
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# 将所有第三方依赖的优化级别设为 1，加快运行速度，且只编译一次
opt-level = 1

[profile.release]
# 生产环境：极限压缩体积（参考知识库中的 Tauri 优化方案）
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
# 构建：tauri 代码生成 / 资源打包
tauri-build = { version = "2.6.2", features = [
  "config-json5",
  "tauri-codegen",
  "codegen",
] }

[dependencies]
thinking-database = { workspace = true }
thinking-core = { workspace = true }
thinking-command = { workspace = true }

# --- Tauri 核心 ---
tauri = { workspace = true } # 应用壳、窗口、tray、IPC

# --- Tauri 插件（已在 bootstrap 注册）---
tauri-plugin-opener = "2.5.2" # 用系统默认应用打开 URL/路径
tauri-plugin-fs = "2.4.5" # 文件系统读写
tauri-plugin-websocket = "2.4.2" # WebSocket（前端能力预留）
tauri-plugin-dialog = "2.6.0" # 原生对话框
tauri-plugin-shell = "2.3.5" # sidecar / 外部命令（corex-serve）
tauri-plugin-store = "2.4.2" # 持久化 KV
tauri-plugin-process = "2.3.1" # 退出 / 重启
tauri-plugin-notification = "2.3.3" # 系统通知
tauri-plugin-clipboard-manager = "2.3.2" # 剪贴板
tauri-plugin-http = { version = "2.5.7", features = [
  "charset",
  "cookies",
  "gzip",
  "http2",
  "json",
  "multipart",
  "rustls-tls",
  "stream",
  "unsafe-headers",
] } # 前端 fetch
tauri-plugin-os = "2.3.2" # OS 信息（前端能力预留）

# --- Tauri 插件（日志）---
tauri-plugin-log = "2.8.0" # 日志桥（Stdout + LogDir；debug 含 Webview）

# --- 异步 / 时间 / 序列化 / 错误 / 日志 ---
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# --- 媒体 / 编解码 ---
base64 = "0.22.1" # 截图 data URL
image = "0.25.10" # 截图解码、托盘徽章

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# --- 桌面专用插件 ---
tauri-plugin-autostart = "2.5.1" # 开机自启（含 --minimized）
tauri-plugin-cli = "2.4.1" # CLI（--minimized / --verbose）
tauri-plugin-global-shortcut = "2.3.1" # 全局快捷键
tauri-plugin-positioner = { version = "2.3.1", features = [
  "tray-icon",
] } # 窗口/托盘定位
tauri-plugin-single-instance = "2.4.0" # 单实例
tauri-plugin-updater = "2" # 检查更新

[target.'cfg(target_os = "windows")'.dependencies]
# --- Windows FFI ---
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
] } # Named Pipe、光标坐标

[target.'cfg(target_os = "macos")'.dependencies]
# --- macOS FFI ---
core-graphics = "0.25" # 光标坐标
