[package]
name        = "i-thinking"
version     = "0.1.0"
description = "i thinking is a privacy-first extension that enhances your browsing experience with intelligent features while prioritizing your data security."
authors     = ["layen"]
edition     = "2024"

# [profile.release]
# opt-level = 2       # 降低优化级别 (从 3 改为 2)
# lto = true          # 链接时优化（平衡大小与速度）
# codegen-units = 1   # 单线程代码生成（提升优化）
# incremental = false # 禁用增量编译（避免优化冲突）
# panic = "abort"     # 替换展开为直接终止（减小体积）
# strip = "symbols"   # 移除调试符号（Rust 1.59+）

[profile.dev]
opt-level = 0          # 保持编译快速
debug = 1              # 降低调试信息体积，加速链接
incremental = true     # 开启增量编译
codegen-units = 16     # 提高并行编译（可按 CPU 核心数调整）

# bin
[[bin]]
name = "i-thinking"
path = "src/bin/thinking.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name       = "thinking"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [
  "config-json5",
  "tauri-codegen",
  "codegen",
] }

[dependencies]
tauri = { version = "2.9.5", features = [
  "protocol-asset",
  "macos-private-api",
  "devtools",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2.5.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.37.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-shell = "2.3.4"
tauri-plugin-store = "2.4.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-sql = { version = "2.3.1", features = ["sqlite"] }
tauri-plugin-http = { version = "2.5.5", features = [
  "charset",
  "cookies",
  "gzip",
  "http2",
  "json",
  "multipart",
  "rustls-tls",
  "stream",
  "unsafe-headers",
] }
libc = "0.2.179"
tauri-plugin-os = "2.3.2"
machine-uid = "0.5.4"
uuid = "1.19.0"
xcap = "0.8.1"
base64 = "0.22.1"
image = "0.25.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart       = "2.5.1"
tauri-plugin-cli             = "2.4.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-positioner      = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.3.7"
