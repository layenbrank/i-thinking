[package]
name        = "i-thinking"
version     = "0.1.0"
description = "i thinking is a privacy-first extension that enhances your browsing experience with intelligent features while prioritizing your data security."
authors     = ["layen"]
edition     = "2024"

[[bin]]
name = "i-thinking"
path = "src/bin/thinking.rs"

[lib]
name       = "thinking"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [
  "config-json5",
  "tauri-codegen",
  "codegen",
] }

[dependencies]
tauri = { version = "2.11.2", features = [
  "protocol-asset",
  "macos-private-api",
  "devtools",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-localhost = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.8.0"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-http = { version = "2.5.7", features = [
  "charset",
  "cookies",
  "gzip",
  "http2",
  "json",
  "multipart",
  "rustls-tls",
  "stream",
  "unsafe-headers",
] }
tauri-plugin-os = "2.3.2"
libc = "0.2.186"
urlencoding = "2.1.3"

sea-orm = { version = "1.1.19", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }
sea-query = "1.0.0"
sea-orm-migration = "1.1.19"

tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

anyhow = "1.0.102"
thiserror = "2.0.18"

sha2 = "0.11.0"
base64 = "0.22.1"

machine-uid = "0.6.0"
hostname = "0.4"

image = "0.25.10"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

dirs = "6.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
