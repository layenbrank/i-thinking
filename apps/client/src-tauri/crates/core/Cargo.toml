[package]
name        = "i-thinking-core"
version     = "0.1.0"
description = "Core business logic for i-thinking (database, services, utils) — no Tauri dependency."
authors     = ["layen"]
edition     = "2024"

[dependencies]
# Database
sea-orm           = { workspace = true }
sea-query         = { workspace = true }
sea-orm-migration = { workspace = true }

# Async
tokio       = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Media / Document (morph module)
pdfium-render = { workspace = true }
image         = { workspace = true }
base64        = { workspace = true }

# System (scan module)
sysinfo = { workspace = true }

# Logging
tracing = { workspace = true }

# Click-through cursor backend (per-platform, used by cursor.rs)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true }
