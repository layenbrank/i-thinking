<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Browser</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 system-ui, Segoe UI, sans-serif;
        background: #f1f3f4;
        color: #202124;
        user-select: none;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 52px;
        padding: 8px 10px;
        border-bottom: 1px solid #dadce0;
      }
      button {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: #5f6368;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      button:hover:not(:disabled) {
        background: #e8eaed;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      form {
        flex: 1;
        min-width: 0;
        display: flex;
      }
      input {
        width: 100%;
        height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.15);
        outline: none;
        font: inherit;
        color: inherit;
      }
      input:focus {
        border-color: #1a73e8;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2), 0 0 0 1px #1a73e8;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button
        type="button"
        id="back"
        title="后退"
        aria-label="后退"
        disabled>
        ←
      </button>
      <button
        type="button"
        id="forward"
        title="前进"
        aria-label="前进"
        disabled>
        →
      </button>
      <button
        type="button"
        id="reload"
        title="刷新"
        aria-label="刷新">
        ↻
      </button>
      <form id="form">
        <input
          id="url"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="搜索 Google 或输入网址"
        />
      </form>
    </div>
    <script src="./shell.js"></script>
  </body>
</html>
