[package]
name = "corex"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "corex"
path = "src/main.rs"

[dependencies]
ffmpeg-next = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows: enable `wgc` so VideoRecorder uses Graphics Capture (continuous frames).
xcap = { version = "0.9", features = ["wgc"] }
