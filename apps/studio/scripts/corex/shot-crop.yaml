name: shot-crop-studio
description: Click studio, full shot, crop to window
steps:
  - id: click
    action: ui.click
    params:
      x: 853
      y: 512
  - id: wait
    action: ui.wait
    params:
      ms: 500
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full.png"
      format: png
  - id: crop
    action: capture.crop
    params:
      file: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full.png"
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-after.png"
      x: 246
      y: 108
      width: 1214
      height: 809