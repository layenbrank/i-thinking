name: shot-large
description: Capture resized studio window
steps:
  - id: click
    action: ui.click
    params:
      x: 830
      y: 76
  - id: wait
    action: ui.wait
    params:
      ms: 500
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full4.png"
      format: png
  - id: crop
    action: capture.crop
    params:
      from: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full4.png"
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-final.png"
      x: 80
      y: 40
      width: 1500
      height: 920