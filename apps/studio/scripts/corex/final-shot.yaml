name: final-shot
description: Titlebar click and crop studio
steps:
  - id: click
    action: ui.click
    params:
      x: 853
      y: 188
  - id: wait
    action: ui.wait
    params:
      ms: 500
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full3.png"
      format: png
  - id: crop
    action: capture.crop
    params:
      from: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-full3.png"
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-after.png"
      x: 366
      y: 148
      width: 974
      height: 729