name: capture-studio
description: Focus studio agent and screenshot
steps:
  - id: focus
    action: ui.window.focus
    params:
      title_contains: i thinking
      prefer_largest: true
  - id: wait
    action: ui.wait
    params:
      ms: 400
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-agent.png"
      format: png