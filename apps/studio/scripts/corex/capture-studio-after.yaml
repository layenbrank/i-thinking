name: capture-studio-after
description: Recapture studio agent after polish
steps:
  - id: focus
    action: ui.window.focus
    params:
      title_contains: i thinking
      prefer_largest: true
  - id: wait
    action: ui.wait
    params:
      ms: 600
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-after.png"
      format: png