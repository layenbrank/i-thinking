name: capture-qoder-agent
description: Focus Qoder, escape settings, screenshot agent
steps:
  - id: focus
    action: ui.window.focus
    params:
      hwnd: 461154
  - id: wait1
    action: ui.wait
    params:
      ms: 300
  - id: esc
    action: ui.key
    params:
      keys: Escape
  - id: wait2
    action: ui.wait
    params:
      ms: 500
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/qoder-agent.png"
      format: png