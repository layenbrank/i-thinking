name: capture-qoder
description: Focus Qoder and screenshot
steps:
  - id: focus
    action: ui.window.focus
    params:
      title_contains: Qoder
      prefer_largest: true
  - id: wait
    action: ui.wait
    params:
      ms: 600
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/qoder-full.png"
      format: png