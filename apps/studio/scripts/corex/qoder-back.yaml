name: qoder-back-and-shot
description: Click back to app then screenshot Qoder workbench
steps:
  - id: focus
    action: ui.window.focus
    params:
      hwnd: 461154
  - id: wait1
    action: ui.wait
    params:
      ms: 200
  - id: click-back
    action: ui.click
    params:
      x: 72
      y: 58
  - id: wait2
    action: ui.wait
    params:
      ms: 800
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/qoder-workbench.png"
      format: png