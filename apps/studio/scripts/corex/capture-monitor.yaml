name: capture-monitor
description: Click then screenshot primary monitor
steps:
  - id: click
    action: ui.click
    params:
      x: 960
      y: 540
  - id: wait
    action: ui.wait
    params:
      ms: 300
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-after.png"
      format: png