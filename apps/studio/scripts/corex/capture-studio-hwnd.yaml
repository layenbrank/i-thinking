name: capture-studio-hwnd
description: Screenshot studio by hwnd
steps:
  - id: focus
    action: ui.window.focus
    params:
      hwnd: 6162160
      prefer_largest: true
  - id: wait
    action: ui.wait
    params:
      ms: 400
  - id: shot
    action: capture.screenshot
    params:
      to: "d:/Documents/monorepo/i-thinking/master/apps/studio/scripts/.tmp-qoder-captures/studio-after.png"
      format: png