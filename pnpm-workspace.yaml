# yaml-language-server: $schema=./.vscode/schemas/pnpm-workspace.json
packages:
  - apps/*
  - packages/*

# 注册源（替代 .npmrc 中的 registry / @scope:registry）
# https://pnpm.io/zh/blog/releases/11.0
registries:
  default: https://registry.npmmirror.com/

# Node.js 运行时下载镜像（替代 .npmrc 的 node-mirror:*）
nodeDownloadMirrors:
  release: https://npmmirror.com/mirrors/node/

# 依赖布局（原 .npmrc → kebab-case 已迁入此处）
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true
# 布局变更时允许非交互清理 node_modules（CI / 脚本）
confirmModulesPurge: false

hoistPattern:
  - '*'
  - '!@i-thinking/*'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*typescript*'
  - '*vite*'
  - '*vitest*'
  - '*turbo*'
  - '*rollup*'
  - '*@rollup/*'
  - '*@nestjs/*'
  - '*jest*'

# 允许执行 install 脚本的包（取代已移除的 onlyBuiltDependencies）
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  prisma: true
  unrs-resolver: true

catalog:
  'electron': ^40.1.0
  'antd': ^6.5.0
  'antd-style': ^4.1.0
  '@ant-design/colors': ^8.0.1
  '@ant-design/icons': ^6.1.0
  '@ant-design/x': ^2.8.0
  '@ant-design/x-markdown': ^2.8.0
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/maker-deb': ^7.11.2
  '@electron-forge/maker-dmg': ^7.11.2
  '@electron-forge/maker-rpm': ^7.11.2
  '@electron-forge/maker-squirrel': ^7.11.2
  '@electron-forge/maker-zip': ^7.11.2
  '@electron-forge/plugin-auto-unpack-natives': ^7.11.2
  '@electron-forge/plugin-fuses': ^7.11.2
  '@electron-forge/plugin-vite': ^7.11.2
  '@electron/fuses': ^1.8.0
  '@electron/rebuild': ^4.0.4
  '@types/electron-squirrel-startup': ^1.0.2
  'prisma': ^7.8.0
  '@prisma/adapter-better-sqlite3': ^7.8.0
  '@prisma/client': ^7.8.0
  'better-sqlite3': ^12.6.2
  'electron-squirrel-startup': ^1.0.1
  'electron-store': ^11.0.2

overrides:
  '@electron/rebuild': ^4.0.4
  'xlsx': 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
  'dayjs': '1.11.21'
  # @reactuses/core 拉到的 1.2.0 未声明 React 19；1.6+ 已支持
  'use-sync-external-store': '1.6.0'
  # 1.2.0 只要 emnapi 2-alpha；1.2.2 兼容 emnapi 1.x
  '@napi-rs/wasm-runtime': '1.2.2'

# vitepress → @docsearch/react@3 未声明 React 19，运行无妨，放宽 peer 检查
peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    '@types/react': '19'

minimumReleaseAgeExclude:
  - '@napi-rs/wasm-runtime@1.2.2'
